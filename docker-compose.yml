services:
  db:
    image: postgres:16
    container_name: crest_db
    environment:
      POSTGRES_USER: crest
      POSTGRES_PASSWORD: crest
      POSTGRES_DB: crest
    ports:
      - "5432:5432"
    volumes:
      - crest_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crest"]
      interval: 5s
      retries: 10

  app:
    build: .
    container_name: crest_app
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://crest:crest@db:5432/crest?schema=public
    depends_on:
      db:
        condition: service_healthy

volumes:
  crest_pg:
